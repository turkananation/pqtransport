schema_version: 1
framework_id: pqtransport-distinguished-engineer
framework_version: 0.1.0
canonical_skill: .grok/skills/pqtransport-distinguished-engineer/SKILL.md
sister_framework: universal-multi-agent-pqc-framework
sister_skill: https://github.com/turkananation/pqcrypto/blob/develop/.claude/skills/universal-pqc-framework/SKILL.md
generated_for_package:
  name: pqtransport
  version: 0.1.0-dev.0

native_wrappers:
  grok: .grok/skills/pqtransport-distinguished-engineer/SKILL.md
  claude: wrappers/claude/SKILL.md
  codex: wrappers/codex/SKILL.md

role:
  id: distinguished_engineer
  order: 3
  owns:
    - package layout and barrels
    - protocol state machines
    - hybrid share concat and length filters
    - immutable session objects
    - replay windows
    - circuit breakers and TTL caches
    - test vectors
  must_not_own:
    - cryptographic claim upgrades
    - provider-specific KMS secrets
    - Flutter isolate / UI plumbing
    - replacing pqforge or swissarmyknife

evidence_boundary:
  no_cmvp_fips_140_claim: true
  zeroization: best_effort_dart
  side_channel_posture: best_effort_dart
  sdk: '>=3.12.0 <4.0.0'
  dependencies:
    pqforge: ^0.4.5
    swissarmyknife: ^0.1.0
  allowed_claims:
    - FIPS 203-aligned ML-KEM via package:pqforge / package:pqcrypto with checked-in KAT evidence in pqcrypto.
    - FIPS 204-aligned ML-DSA, byte-exact on pqcrypto's checked-in KAT corpus.
    - TLS 1.3 hybrid groups X25519MLKEM768 and SecP256r1MLKEM768 as specified by RFC 10024.
    - Pure-Dart transport. No dart:ffi. Cryptography exclusively from pqforge.
    - Best-effort zeroization in Dart.
  forbidden_claims:
    - fully FIPS validated
    - CMVP validated
    - certified
    - hard constant-time Dart guarantee
    - hard memory-erasure guarantee
    - OpenSSL interoperable before an interop fixture exists

primitive_profile:
  hybrid_required: true
  default_group: X25519MLKEM768
  groups:
    X25519MLKEM768:
      codepoint: 0x11EC
      client_share_bytes: 1216
      server_share_bytes: 1120
      shared_secret_bytes: 64
      concat: mlkem_then_x25519
      client: [mlkem768_ek: 1184, x25519_pk: 32]
      server: [mlkem768_ct: 1088, x25519_pk: 32]
      shared_secret: [mlkem768_ss: 32, x25519_ss: 32]
    SecP256r1MLKEM768:
      codepoint: 0x11EB
      client_share_bytes: 1249
      server_share_bytes: 1153
      shared_secret_bytes: 64
      concat: ecdhe_then_mlkem
      client: [secp256r1_uncompressed: 65, mlkem768_ek: 1184]
      server: [secp256r1_uncompressed: 65, mlkem768_ct: 1088]
      shared_secret: [ecdhe_ss: 32, mlkem768_ss: 32]
  lattice_kem:
    algorithm: ML-KEM-768
    public_key_bytes: 1184
    ciphertext_bytes: 1088
    secret_key_bytes: 2400
    shared_secret_bytes: 32
  identity_signature:
    algorithm: ML-DSA-65
    public_key_bytes: 1952
    secret_key_bytes: 4032
    signature_bytes: 3309
  optional_hash_signature:
    algorithm: SLH-DSA
    status: low_frequency_artifact_or_mdns_opt_in
  hkdf:
    tls: RFC8446_key_schedule
    udp_info_prefix: "pqtransport udp-session v1"
    udp_output_bytes: 32

strict_filters:
  mlKem768PublicKey: 1184
  mlKem768Ciphertext: 1088
  mlDsa65PublicKey: 1952
  mlDsa65Signature: 3309
  nonce: 32
  x25519MlKem768ClientShare: 1216
  x25519MlKem768ServerShare: 1120
  secP256r1MlKem768ClientShare: 1249
  secP256r1MlKem768ServerShare: 1153
  handshake_timestamp_window_ms: 2000

module_order:
  - core
  - socket
  - udp
  - tls
  - dns
  - mdns
  - http1
  - quic
  - http3

swissarmyknife:
  state_machine: required_for_tls_quic_mdns_udp_reliability
  result: required_for_every_parse_and_trigger
  circuit_breaker: required_for_doh_dot_system_resolver
  cache: required_for_dns_mdns_ttl
  throttler: required_for_udp_send
  retry: required_for_retransmit
  event_bus: required_for_mdns
  task_queue: required_for_quic_http_streams

laws:
  - zero_native_crypto
  - zero_ffi
  - no_reimplement_primitives
  - hybrid_mandatory
  - group_dependent_concat
  - length_filter_before_crypto
  - result_typed_parses
  - best_effort_zeroize
  - replay_before_expensive_crypto
  - fail_secure_no_classical_silent_fallback

validation_gates:
  universal:
    - dart analyze
    - no dart:ffi
    - no size literals outside lengths.dart
  tls:
    - hybrid_share both groups
    - illegal event -> failed
    - HRR once then fail
    - key schedule fixture
