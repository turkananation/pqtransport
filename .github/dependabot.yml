version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Foundations are pinned to published minor lines; bump them deliberately.
      - dependency-name: pqforge
        update-types: ["version-update:semver-major"]
      - dependency-name: swissarmyknife
        update-types: ["version-update:semver-major"]
