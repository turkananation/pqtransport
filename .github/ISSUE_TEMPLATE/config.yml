blank_issues_enabled: false
contact_links:
  - name: Security advisory (private)
    url: https://github.com/turkananation/pqtransport/security/advisories/new
    about: Report a suspected vulnerability privately. Do not file a public issue.
  - name: Ask a question
    url: https://github.com/turkananation/pqtransport/discussions/new?category=q-a
    about: Usage questions about hybrid TLS, UDP, DNS/mDNS, QUIC, or HTTP.
  - name: Discuss ideas
    url: https://github.com/turkananation/pqtransport/discussions/new?category=ideas
    about: Propose a protocol slice or API change before opening a feature issue.
  - name: Primitive bug in pqforge / pqcrypto
    url: https://github.com/turkananation/pqforge/issues/new/choose
    about: ML-KEM, ML-DSA, AES-GCM, X25519, and HKDF bugs belong in pqforge (evidence in pqcrypto), not here.
