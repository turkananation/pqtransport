name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Jaspr site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Stage agent files into the Jaspr web root
        run: cp llms.txt site/web/llms.txt

      - name: Install workspace dependencies
        run: dart pub get

      - name: Activate Jaspr
        run: dart pub global activate jaspr_cli

      - name: Build site
        working-directory: site
        run: dart pub global run jaspr_cli:jaspr build --verbose --sitemap-domain https://turkananation.github.io/pqtransport

      - name: Rewrite absolute anchors for /pqtransport/ base
        run: python3 tool/fix_pages_base.py site/build/jaspr

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/build/jaspr

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
