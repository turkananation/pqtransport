name: Release

# Verify a version tag and create the GitHub Release. pub.dev publishing is
# `.github/workflows/publish.yml` (OIDC, environment `pub.dev`) on the same
# `vX.Y.Z` tag — do not also run `dart pub publish` by hand.
#
# This is a library. There is no CLI binary matrix (unlike pqforge).
# Create the GitHub Release in one shot: do not publish an empty release and
# attach assets later (GitHub immutable releases lock assets after publish).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify tag and create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze source
        run: dart analyze --fatal-infos

      - name: Check invariants
        run: bash tool/check_invariants.sh .

      - name: Run tests
        run: dart test

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: Assert tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          pubspec_ver="$(python3 -c "import pathlib,re; t=pathlib.Path('pubspec.yaml').read_text(); print(re.search(r'^version:\s+(\S+)', t, re.M).group(1))")"
          test "$ver" = "$pubspec_ver"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          body: |
            `pqtransport` ${{ github.ref_name }}

            Verified by the release workflow:
            - `dart format`
            - `dart analyze --fatal-infos`
            - `tool/check_invariants.sh`
            - `dart test`
            - `dart pub publish --dry-run`
            - tag matches `pubspec.yaml` version

            pub.dev publishing is automatic via
            [`.github/workflows/publish.yml`](https://github.com/turkananation/pqtransport/blob/main/.github/workflows/publish.yml)
            (GitHub Actions OIDC, environment `pub.dev`) on `vX.Y.Z` tags.

            This is not a FIPS 140 module. See [doc/CLAIM_BOUNDARY.md](https://github.com/turkananation/pqtransport/blob/main/doc/CLAIM_BOUNDARY.md).
