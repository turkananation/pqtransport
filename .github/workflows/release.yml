name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify tag and create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze source
        run: dart analyze --fatal-infos

      - name: Check invariants
        run: bash tool/check_invariants.sh .

      - name: Run tests
        run: dart test

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: Assert tag matches pubspec version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          pubspec_ver="$(python3 -c "import pathlib,re; t=pathlib.Path('pubspec.yaml').read_text(); print(re.search(r'^version:\s+(\S+)', t, re.M).group(1))")"
          test "$ver" = "$pubspec_ver"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            `pqtransport` ${{ github.ref_name }}

            Verified by the release workflow:
            - `dart format`
            - `dart analyze --fatal-infos`
            - `tool/check_invariants.sh`
            - `dart test`
            - `dart pub publish --dry-run`
            - tag matches `pubspec.yaml` version

            Publishing to pub.dev is a **manual** maintainer step
            (`dart pub publish`) after this GitHub release is green.
            This is not a FIPS 140 module. See [doc/CLAIM_BOUNDARY.md](doc/CLAIM_BOUNDARY.md).
