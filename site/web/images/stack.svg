<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="st">
  <title id="st">pqtransport sits above pqforge and pqcrypto</title>
  <rect width="760" height="420" fill="#070d14"/>
  <rect x="48" y="28" width="664" height="72" rx="10" fill="#12241c" stroke="#b6f25c"/>
  <text x="72" y="58" fill="#b6f25c" font-family="IBM Plex Mono, monospace" font-size="12">APPLICATION</text>
  <text x="72" y="82" fill="#e8f4ef" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700">HTTP/1.1 · DNS · mDNS · QUIC frames</text>
  <rect x="48" y="116" width="664" height="80" rx="10" fill="#0e1822" stroke="#4ee0d4"/>
  <text x="72" y="148" fill="#4ee0d4" font-family="IBM Plex Mono, monospace" font-size="12">PQTRANSPORT</text>
