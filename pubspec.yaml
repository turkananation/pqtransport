name: pqtransport
description: >-
  Pure-Dart post-quantum transport: TLS 1.3 (RFC 10024 hybrids,
  X25519, P-256, P-384, ML-KEM-1024), DNSSEC, DoH/DoT, mDNS, QUIC,
  and HTTP/1.1–3. Cryptography is pqforge. No FFI.
version: 0.2.0
homepage: https://turkananation.github.io/pqtransport/
repository: https://github.com/turkananation/pqtransport
issue_tracker: https://github.com/turkananation/pqtransport/issues
documentation: https://github.com/turkananation/pqtransport/blob/main/doc/INDEX.md
topics:
  - cryptography
  - tls
  - quic
  - network
  - flutter

environment:
  sdk: ^3.12.0

workspace:
  - site

dependencies:
  # 0.4.13: 1024-bit RSA verify, SHA-1 and SHA-224 PKCS#1, Ed448.
  pqforge: ^0.4.13
  zeroize: ^0.2.0
  swissarmyknife: ^0.1.0

dev_dependencies:
  coverage: ^1.15.1
  lints: ^6.0.0
  test: ^1.25.6
