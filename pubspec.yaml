name: pqtransport
description: >-
  Pure-Dart post-quantum transport: UDP, TLS 1.3 hybrid
  (X25519MLKEM768 / SecP256r1MLKEM768 / SecP384r1MLKEM1024),
  DNS/DoH/DoT, mDNS, QUIC, HTTP/1.1–3.
version: 0.1.0
homepage: https://turkananation.github.io/pqtransport/
repository: https://github.com/turkananation/pqtransport
issue_tracker: https://github.com/turkananation/pqtransport/issues
documentation: https://github.com/turkananation/pqtransport/blob/main/doc/INDEX.md
topics:
  - cryptography
  - tls
  - quic
  - network
  - flutter

environment:
  sdk: ^3.12.0

workspace:
  - site

dependencies:
  pqforge: ^0.4.5
  swissarmyknife: ^0.1.0

dev_dependencies:
  coverage: ^1.15.1
  lints: ^6.0.0
  test: ^1.25.6
