name: pqtransport
description: >-
  Pure-Dart post-quantum transport: UDP, TLS 1.3 hybrid
  (X25519MLKEM768 / SecP256r1MLKEM768 / SecP384r1MLKEM1024),
  DNS/DoH/DoT, mDNS, QUIC, HTTP/1.1–3.
version: 0.1.0
homepage: https://turkananation.github.io/pqtransport/
repository: https://github.com/turkananation/pqtransport
issue_tracker: https://github.com/turkananation/pqtransport/issues
documentation: https://github.com/turkananation/pqtransport/blob/main/doc/INDEX.md
topics:
  - cryptography
  - tls
  - quic
  - network
  - flutter

environment:
  sdk: ^3.12.0

workspace:
  - site

dependencies:
  # Git pin of 0.4.13 (7d0b293) until that version is on pub.dev.
  # Replace with pqforge: ^0.4.13 before publishing this package.
  pqforge:
    git:
      url: https://github.com/turkananation/pqforge.git
      ref: 7d0b293e3283160ccca230974b1e6c56bb161fa7
  zeroize: ^0.2.0
  swissarmyknife: ^0.1.0

dev_dependencies:
  coverage: ^1.15.1
  lints: ^6.0.0
  test: ^1.25.6
